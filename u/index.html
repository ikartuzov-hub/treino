<style>
  :root{
    --cream:#F2EBDA; --paper:#FBF7EC; --ink:#16302B; --ink-soft:#54655A;
    --azul:#1F7A5C; --azul-deep:#0E5138; --terra:#BC4B2F; --gold:#C2872E;
    --line:#DBD0B8; --good:#3E7A57; --soft-shadow:0 18px 40px -22px rgba(22,48,43,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink);font-family:"Hanken Grotesk",sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100vh;padding:18px 16px 48px;
    background-image:radial-gradient(circle at 12% 8%,rgba(31,122,92,.08),transparent 42%),radial-gradient(circle at 88% 0%,rgba(194,135,46,.08),transparent 38%);}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:2px 2px}
  .wm{font-family:"Fraunces",serif;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink);line-height:1}
  .wm em{font-style:italic;color:var(--gold)}
  .flag{font-size:13px;color:var(--ink-soft)}
  .tabs{display:flex;flex-wrap:wrap;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px;box-shadow:var(--soft-shadow)}
  .tab{flex:1 1 28%;min-width:0;border:1px solid var(--line);background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:10px 6px;border-radius:10px;cursor:pointer;transition:.18s;line-height:1.2;text-align:center}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .weekbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(31,122,92,.08);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
  .weekbar b{color:var(--azul-deep)}
  .weekbar button{font-family:inherit;font-size:13px;font-weight:700;color:var(--azul);background:none;border:none;cursor:pointer;padding:4px 2px;white-space:nowrap}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--soft-shadow);min-height:300px;display:flex;flex-direction:column}
  .sit{align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--azul);background:rgba(31,122,92,.10);padding:5px 11px;border-radius:99px;margin-bottom:18px}
  .chead{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:18px}
  .chead .sit{margin-bottom:0}
  .src{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--ink-soft);background:rgba(194,135,46,.10);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
  .ru{font-size:20px;font-weight:500;line-height:1.4}
  .cue{margin-top:13px;font-family:"Fraunces",serif;font-style:italic;font-size:16px;color:var(--ink-soft)}
  .cue span{color:var(--azul-deep);font-style:normal;font-weight:600}
  .pt{font-family:"Fraunces",serif;font-size:24px;line-height:1.38;margin-top:16px;color:var(--azul-deep)}
  .pt mark{background:linear-gradient(transparent 55%,rgba(194,135,46,.45) 55%);padding:0 1px;border-radius:2px}
  .spacer{flex:1}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
  button.act{font-family:inherit;font-weight:600;font-size:15px;border-radius:11px;padding:13px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:.16s;flex:1;min-width:110px}
  button.act:active{transform:translateY(1px)}
  button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.ghost{background:transparent}
  button.good{background:var(--good);color:#fff;border-color:var(--good)}
  button.bad{background:var(--terra);color:#fff;border-color:var(--terra)}
  button.listen{flex:0 0 auto;min-width:0;width:52px;padding:13px 0;font-size:19px}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .opt{font-family:"Fraunces",serif;font-size:19px;text-align:left;padding:14px 17px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--azul-deep);cursor:pointer;transition:.15s}
  .opt.correct{background:rgba(62,122,87,.14);border-color:var(--good);color:var(--good)}
  .opt.wrong{background:rgba(188,75,47,.12);border-color:var(--terra);color:var(--terra)}
  .rule{margin-top:16px;font-size:14px;line-height:1.5;color:var(--ink-soft);border-left:3px solid var(--gold);padding:5px 0 5px 13px;background:rgba(194,135,46,.06)}
  .rule b{color:var(--ink)}
  .seq-bank,.seq-built{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .chip{display:flex;align-items:center;gap:10px;font-family:"Fraunces",serif;font-size:16px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--paper);cursor:pointer;transition:.14s;text-align:left;color:var(--azul-deep);line-height:1.3}
  .chip:active{transform:scale(.99)}
  .chip .tense{font-family:"Hanken Grotesk";font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:99px;flex:0 0 auto}
  .t-pas{background:rgba(188,75,47,.14);color:var(--terra)}
  .t-pre{background:rgba(62,122,87,.16);color:var(--good)}
  .t-fut{background:rgba(194,135,46,.16);color:var(--gold)}
  .chip.placed{opacity:.35;pointer-events:none}
  .seq-built .chip{background:rgba(22,48,43,.04)}
  .seq-built.ok .chip{border-color:var(--good)}
  .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);margin-top:16px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--ink-soft)}
  .boxes{display:flex;gap:5px}
  .boxes i{width:9px;height:9px;border-radius:2px;background:var(--line);display:inline-block;transition:.2s}
  .boxes i.on{background:var(--azul)} .boxes i.full{background:var(--good)}
  .count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
  .done{text-align:center;padding:18px 0}
  .done h2{font-family:"Fraunces",serif;font-size:23px;margin-bottom:8px}
  .done p{color:var(--ink-soft);margin-bottom:18px}
  .reset{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:14px}
  .week-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:9px;cursor:pointer;font-family:inherit;transition:.15s}
  .week-item:active{transform:scale(.995)}
  .week-item .wk{font-family:"Fraunces",serif;font-size:19px;color:var(--azul-deep);font-weight:600;flex:0 0 auto;width:82px}
  .week-item .wk small{display:block;font-family:"Hanken Grotesk";font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .week-item .pv{flex:1;font-size:13.5px;color:var(--ink-soft);line-height:1.4}
  .week-item .cur{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--good);background:rgba(62,122,87,.14);padding:3px 7px;border-radius:99px}
  .detail-line{margin-bottom:14px;padding-left:12px;border-left:3px solid var(--line)}
  .detail-line.l-pas{border-color:var(--terra)} .detail-line.l-pre{border-color:var(--good)} .detail-line.l-fut{border-color:var(--gold)}
  .detail-line .dpt{font-family:"Fraunces",serif;font-size:18px;color:var(--azul-deep);line-height:1.35;cursor:pointer}
  .detail-line .dru{font-size:13px;color:var(--ink-soft);margin-top:3px}
  .back{align-self:flex-start;background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--azul);cursor:pointer;margin-bottom:14px;padding:2px 0}
  .note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:20px;line-height:1.6}
  .loading{text-align:center;color:var(--ink-soft);padding:60px 0;font-family:"Fraunces",serif;font-style:italic}
  .afilter{display:flex;gap:6px;margin-bottom:16px}
  .afb{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 4px;cursor:pointer;transition:.15s}
  .afb.on{background:rgba(31,122,92,.12);border-color:var(--azul);color:var(--azul-deep)}
  .pairbox{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:"Fraunces",serif;font-size:19px}
  .pairbox .w1{color:var(--terra)}
  .pairbox .w2{color:var(--good);font-weight:600}
  .pairbox .ar{color:var(--ink-soft);font-size:16px}
  /* свайп: лёгкая отдача карточки */
  .card{transition:transform .15s ease, opacity .15s ease}
  .card.sw-l{transform:translateX(-14px);opacity:.5}
  .card.sw-r{transform:translateX(14px);opacity:.5}
  /* CTA подписки */
  .cta{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
  .cta-t{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px}
  .cta-btn{display:inline-block;background:var(--gold);color:#fff;font-family:inherit;font-weight:700;font-size:15px;text-decoration:none;padding:13px 20px;border-radius:11px}
  .cta-link{display:block;margin-top:10px;font-size:13px;color:var(--azul);text-decoration:underline}
  .applinks{text-align:center;margin-top:10px;font-size:12.5px}
  .applinks a{color:var(--azul,#1F7A5C);text-decoration:none;font-weight:600;white-space:nowrap}
  .applinks .sep{color:var(--ink-soft);margin:0 8px;opacity:.6}
  /* экран выбора языка/пары */
  .picker{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream);background-image:radial-gradient(circle at 12% 8%,rgba(31,122,92,.10),transparent 42%),radial-gradient(circle at 88% 0%,rgba(194,135,46,.10),transparent 38%)}
  .pick-card{max-width:420px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--soft-shadow)}
  .pick-title{font-family:"Fraunces",serif;font-size:18px;color:var(--ink);text-align:center;margin-bottom:20px;line-height:1.4}
  .pick-list{display:flex;flex-direction:column;gap:10px}
  .pick-btn{display:flex;align-items:center;gap:10px;font-family:inherit;font-size:15px;font-weight:600;color:var(--azul-deep);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px;cursor:pointer;transition:.15s;text-align:left}
  .pick-btn:active{transform:translateY(1px)}
  .pick-btn:hover{border-color:var(--azul);background:rgba(31,122,92,.06)}
  .pick-btn .pf{font-size:20px;flex:0 0 auto}
  .pick-btn .pn{flex:1;white-space:nowrap}
  @media (max-width:430px){
    .picker{padding:16px}
    .pick-card{padding:22px 16px}
    .pick-btn{font-size:14px;gap:8px;padding:13px 12px}
    .pick-btn .pf{font-size:18px}
  }

  .langbtn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft,#54655A);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;transition:.15s;line-height:1}
  .langbtn:active{transform:translateY(1px)}
  .langbtn:hover{border-color:var(--azul);color:var(--azul-deep)}
  .langbtn-globe{font-size:14px}
  .owner{text-align:center;margin-top:16px;font-size:11px;color:var(--ink-soft,#54655A);opacity:.6;letter-spacing:.02em}
  /* ===== СВЯЗКИ (модуль contr) ===== */
  .contr-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:2px}
  .contr-prep{font-family:"Fraunces",serif;font-size:30px;color:var(--terra);font-weight:600}
  .contr-plus{font-size:19px;color:var(--ink-soft)}
  .contr-art{font-family:"Fraunces",serif;font-size:30px;color:var(--azul-deep);font-weight:600}
  .contr-noun{font-family:"Fraunces",serif;font-style:italic;font-size:18px;color:var(--ink-soft);align-self:center;margin-left:4px}
  .matrix{width:100%;border-collapse:collapse;margin-top:10px;font-family:"Fraunces",serif}
  .matrix th,.matrix td{border:1px solid var(--line);padding:8px 4px;text-align:center;font-size:15px}
  .matrix th{font-family:"Hanken Grotesk";font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);background:rgba(31,122,92,.06)}
  .matrix td.pp{font-family:"Hanken Grotesk";font-weight:700;color:var(--terra);background:rgba(188,75,47,.05)}
  .matrix td b{color:var(--azul-deep)}
</style>
</head>
<body>
<div id="picker" class="picker" style="display:none"></div>
<div class="wrap">
  <header>
    <span class="wm" id="wm">· <em>Treino</em></span>
    <button class="langbtn" id="langBtn" type="button" aria-label="Сменить язык"><span class="langbtn-globe">🌐</span><span class="flag" id="flag"></span></button>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="recall"></button>
    <button class="tab" data-mode="cloze"></button>
    <button class="tab" data-mode="contr"></button>
    <button class="tab" data-mode="seq"></button>
    <button class="tab" data-mode="anton"></button>
    <button class="tab" data-mode="syn"></button>
  </div>
  <div class="weekbar" id="weekbar"><span id="weekLabel"></span><button id="archBtn"></button></div>
  <div class="card" id="card"><div class="loading">…</div></div>
  <p class="note" id="footNote"></p>
  <p class="applinks" id="appLinks"></p>
  <p class="owner">© Igor Kartuzov · Treino</p>
</div>

<script>
/* ============================================================
   УНИВЕРСАЛЬНЫЙ ДВИЖОК TREINO
   - Контент и настройки берутся из data.json (его готовит Cowork).
   - "ru" = строка на ИСХОДНОМ языке ученика; "pt" = на ЦЕЛЕВОМ (что учит).
   - config.lang  : язык озвучки целевого (pt-PT / en-GB / ru-RU / ...).
   - config.ui    : язык интерфейса (ru / en ; pt / es добавляются в I18N).
   - config.neg   : пример отрицания для «Антонимов» (Não, é… / Нет, … / No, …).
   - config.subscribeUrl / subscribeText / subscribeBtn : кнопка подписки.
   - config.flyerUrl / flyerText : ссылка на рекламную листовку.
   - Род целевого языка зашит прямо в контенте под пол ученика.
   ============================================================ */

/* ---- словари интерфейса (каркас; pt/es допишем при запуске тех учеников) ---- */
/* ===== ЛОКАЛИ (слой 2): грузятся из ui/ui.{lang}.json. Движок языков НЕ знает. ===== */
let I18N = {};     // кэш загруженных локалей
let L = null;      // активная локаль (ставится при загрузке пары)

/* Встроенный минимальный fallback-словарь (en) — если загрузка локали сорвётся. */
const EMBEDDED_L = {

 },

 },

  "one": "part",

 }
};

/* ===== Мини-словарь модуля «Связки» (живёт в движке, как EMBEDDED_L).
   При следующем обновлении локалей блок переносится в ui.{lang}.json → L.contr. ===== */
const CONTR_L = {
 ru:{tab:"Связки",head:"связки · предлог + артикль",ex:"Пример из истории",matrix:"Таблица связок",arc:"архив · связки",done:"Связки закрыты ✓",empty:"Связок пока нет.",correct:"верно.",right:"правильная форма.",noJoin:"<b>com</b> и <b>para</b> в письме НЕ сливаются — пишем раздельно.",showMatrix:"Показать таблицу связок"},
 en:{tab:"Contractions",head:"contractions · prep + article",ex:"Example",matrix:"Contractions table",arc:"archive · contractions",done:"Contractions done ✓",empty:"No contractions yet.",correct:"correct.",right:"correct form.",noJoin:"<b>com</b> and <b>para</b> don't contract in writing.",showMatrix:"Show contractions table"},
 pt:{tab:"Contrações",head:"contrações · prep + artigo",ex:"Exemplo",matrix:"Tabela de contrações",arc:"arquivo · contrações",done:"Contrações feitas ✓",empty:"Ainda sem contrações.",correct:"correto.",right:"forma correta.",noJoin:"<b>com</b> e <b>para</b> não contraem na escrita.",showMatrix:"Ver tabela"},
 es:{tab:"Contracciones",head:"contracciones · prep + artículo",ex:"Ejemplo",matrix:"Tabla",arc:"archivo · contracciones",done:"Contracciones hechas ✓",empty:"Aún sin contracciones.",correct:"correcto.",right:"forma correcta.",noJoin:"<b>com</b>/<b>para</b> no se contraen.",showMatrix:"Ver tabla"},
 de:{tab:"Verschmelzungen",head:"Präposition + Artikel",ex:"Beispiel",matrix:"Tabelle",arc:"Archiv · Verschmelzungen",done:"Fertig ✓",empty:"Noch keine.",correct:"richtig.",right:"richtige Form.",noJoin:"com/para verschmelzen nicht.",showMatrix:"Tabelle anzeigen"}
};
function CL(){ return (L&&L.contr) || CONTR_L[(DATA.config&&DATA.config.ui)] || CONTR_L.en; }

/* Склонение из данных локали (заменяет прежнюю функцию parts). */
function pluralForm(n){
  var r=(L&&L.plural)||"one_other";
  if(r==="slavic"){var x=n%10,y=n%100;return (x===1&&y!==11)?"one":(x>=2&&x<=4&&(y<10||y>=20))?"few":"many";}
  return n===1?"one":"other";
}
function partsStr(n){ var p=(L&&L.parts)||{}, f=pluralForm(n); return n+" "+(p[f]||p.other||p.many||""); }

/* ===== прогресс на устройстве + интервальное повторение ===== */
let LS_KEY="treino_progress_v1";
const DAY=86400000, REFRESH=[7,14,30,60];
function loadProgress(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};}}
function saveProgress(){try{localStorage.setItem(LS_KEY,JSON.stringify(progress));}catch(e){}}
function getRec(k){const v=progress[k];if(v==null)return{b:1,d:0,i:0};if(typeof v==="number")return{b:v,d:0,i:0};return{b:v.b||1,d:v.d||0,i:v.i||0};}
function isActive(k){const r=getRec(k);return r.b<5||Date.now()>=r.d;}
function rateKey(k,ok){let r=getRec(k);
  if(ok){r.b=Math.min(5,r.b+1);
    if(r.b===5){const ni=r.i?REFRESH[Math.min(REFRESH.length-1,REFRESH.indexOf(r.i)+1)]:REFRESH[0];r.i=ni;r.d=Date.now()+ni*DAY;}
    else{r.d=0;r.i=0;}
  }else{r.b=1;r.d=0;r.i=0;}
  progress[k]={b:r.b,d:r.d,i:r.i};saveProgress();return r.b;}

/* ===== TTS (язык целевой из config.lang) ===== */
let voices=[], LANG="pt-PT";
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){
  if(!voices.length)return null;
  const base=LANG.toLowerCase();
  let v=voices.find(x=>x.lang&&x.lang.toLowerCase().replace("_","-")===base);
  if(base==="pt-pt"){
    if(!v)v=voices.find(x=>/joana|catarina|madalena|in[eê]s|duarte|\(portugal\)/i.test(x.name||""));
    if(!v)v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith("pt")&&!/br/i.test(x.lang));
  }
  if(base==="en-gb"){
    if(!v)v=voices.find(x=>/daniel|kate|serena|arthur|martha|oliver|stephanie|libby|sonia|united kingdom|\(uk\)/i.test(x.name||""));
    if(!v)v=voices.find(x=>x.lang&&/en[-_]gb/i.test(x.lang));
  }
  if(base.startsWith("ru")){
    if(!v)v=voices.find(x=>/milena|yuri|katya|russia/i.test(x.name||""));
    if(!v)v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith("ru"));
  }
  if(!v)v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(base.split("-")[0]));
  return v;
}
function speak(text){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang=LANG;u.rate=.85;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}speechSynthesis.cancel();speechSynthesis.speak(u);}

/* ===== CONTRACTIONS (связки: предлог + артикль) ===== */
let kQ=[],kI=0,kAns=false,kOpts=null,kCorrect="";
const kId=c=>c.prep+"|"+c.art+"|"+c.noun;
const OPP_G={o:'a',a:'o',os:'as',as:'os'}, OPP_N={o:'os',a:'as',os:'o',as:'a'};
function contrCorrect(it){const r=CRULES[it.prep]||{};return (r.joins&&r.forms)?(r.forms[it.art]+" "+it.noun):(it.prep+" "+it.art+" "+it.noun);}
function buildContrOpts(it){
  const r=CRULES[it.prep]||{}, noun=it.noun; let correct,pool=[];
  if(r.joins&&r.forms){
    correct=r.forms[it.art]+" "+noun;
    pool=[it.prep+" "+it.art+" "+noun, r.forms[OPP_G[it.art]]+" "+noun, r.forms[OPP_N[it.art]]+" "+noun];
  } else {
    correct=it.prep+" "+it.art+" "+noun;
    ['em','a','por'].forEach(p=>{if(CRULES[p]&&CRULES[p].forms)pool.push(CRULES[p].forms[it.art]+" "+noun);});
  }
  pool=[...new Set(pool)].filter(x=>x!==correct);
  pool=pool.sort(()=>Math.random()-.5).slice(0,3);
  return {correct, opts:[correct,...pool].sort(()=>Math.random()-.5)};
}
function buildKQ(){kQ=CONTRACTIONS.filter(c=>isActive("C:"+kId(c))).sort((a,b)=>a.box-b.box);kI=0;kAns=false;}
function renderContr(){
  if(!CONTRACTIONS.length){card.innerHTML='<div class="done"><p>'+CL().empty+'</p></div>';return;}
  if(kI>=kQ.length){const avg=CONTRACTIONS.length?(CONTRACTIONS.reduce((s,p)=>s+p.box,0)/CONTRACTIONS.length).toFixed(1):'—';
    let h='<div class="done"><h2>'+CL().done+'</h2><p>'+L.avgBoxShort+'<b>'+avg+'</b>/5.</p>';
    if(Object.keys(CRULES).some(k=>CRULES[k]&&CRULES[k].forms))h+='<button class="act ghost" onclick="showMatrix()">'+CL().showMatrix+'</button>';
    h+='<div class="row"><button class="act primary" onclick="buildKQ();renderContr()">'+L.nextRound+'</button></div>'+ctaHTML()+'</div>';
    card.innerHTML=h;return;}
  const it=kQ[kI], b=buildContrOpts(it);kOpts=b.opts;kCorrect=b.correct;
  let h=head(CL().head,it.week);
  h+='<div class="contr-head"><span class="contr-prep">'+it.prep+'</span><span class="contr-plus">+</span><span class="contr-art">'+it.art+'</span><span class="contr-noun">'+it.noun+'</span></div><div class="cue" style="margin-top:6px">'+it.ru+'</div>';
  h+='<div class="opts">';
  kOpts.forEach((o,i)=>h+='<button class="opt" onclick="ansContr('+i+')">'+o+'</button>');
  h+='</div><div id="fb"></div>';
  h+='<div class="spacer"></div><div class="meta"><span>'+L.box+'</span>'+boxesHTML(it.box)+'<span class="count">'+(kI+1)+' / '+kQ.length+'</span></div>';
  card.innerHTML=h;kAns=false;
}
function ansContr(i){
  if(kAns)return;kAns=true;const it=kQ[kI],chosen=kOpts[i],ok=(chosen===kCorrect);
  card.querySelectorAll(".opt").forEach((b,bi)=>{if(kOpts[bi]===kCorrect)b.classList.add("correct");if(bi===i&&!ok)b.classList.add("wrong");});
  it.box=rateKey("C:"+kId(it),ok);
  const rule=(CRULES[it.prep]&&CRULES[it.prep].rule)||CL().noJoin;
  const ex=it.ex?'<div class="lbl">'+CL().ex+'</div><div class="pt" style="font-size:19px;cursor:pointer" onclick="speakContrEx()">'+markHi(it.ex,[kCorrect])+'</div><div class="dru" style="color:var(--ink-soft);font-size:14px;margin-top:4px">'+(it.exru||"")+'</div>':'';
  document.getElementById("fb").innerHTML='<div class="rule"><b>'+kCorrect+'</b> — '+(ok?CL().correct:CL().right)+'<br>'+rule+'</div>'+ex+'<div class="row"><button class="act listen" onclick="speakContrEx()">🔊</button><button class="act primary" onclick="kI++;renderContr()">'+L.next+'</button></div>';
}
function speakContrEx(){const it=kQ[kI];speak((it&&it.ex)||kCorrect);}
function showMatrix(){
  const ord=["em","de","a","por"].filter(p=>CRULES[p]&&CRULES[p].forms),cols=["o","a","os","as"];
  let h='<button class="back" onclick="renderContr()">'+L.toTraining+'</button><span class="sit">'+CL().matrix+'</span>';

/* ===== SEQUENCE ===== */
let order=[],built=[],shuffled=[];
function renderSeq(){
  const w=getWeek(selWeek);if(!w){card.innerHTML='<div class="done"><p>'+L.noStories+'</p></div>';return;}
  order=w.sentences.map((_,i)=>i);built=[];
  let h='<span class="sit">'+L.seqHead+w.label+'</span><div class="ru" style="font-size:16px">'+L.seqIntro+'</div>';
  h+='<div class="lbl">'+L.bankLbl+'</div><div class="seq-bank" id="bank"></div><div class="lbl">'+L.builtLbl+'</div><div class="seq-built" id="builtBox"></div>';
  h+='<div class="row"><button class="act ghost" onclick="renderSeq()">'+L.resetBtn+'</button><button class="act primary" onclick="checkSeq()">'+L.checkBtn+'</button></div><div id="fb"></div>';
  card.innerHTML=h;
  shuffled=[...order].sort(()=>Math.random()-.5);paintSeq();
}
function paintSeq(){
  const w=getWeek(selWeek),bank=document.getElementById("bank"),bb=document.getElementById("builtBox");
  bank.innerHTML="";bb.innerHTML="";
  shuffled.forEach(idx=>{const s=w.sentences[idx];const placed=built.includes(idx);
    const c=document.createElement("button");c.className="chip "+(placed?"placed":"");
    c.innerHTML='<span class="tense '+TCLS[s.t]+'">'+L.tense[s.t]+'</span>'+s.pt;
    c.onclick=()=>{if(!built.includes(idx)){built.push(idx);paintSeq();}};bank.appendChild(c);});
  built.forEach((idx,pos)=>{const s=w.sentences[idx];const c=document.createElement("button");c.className="chip";
    c.innerHTML='<span class="tense '+TCLS[s.t]+'">'+(pos+1)+'</span>'+s.pt;
    c.onclick=()=>{built.splice(pos,1);paintSeq();};bb.appendChild(c);});
}
function checkSeq(){
  const w=getWeek(selWeek),fb=document.getElementById("fb");
  if(built.length<w.sentences.length){fb.innerHTML='<div class="rule">'+L.addAll+'</div>';return;}
  const right=built.filter((v,i)=>v===order[i]).length;
  if(right===w.sentences.length){document.getElementById("builtBox").classList.add("ok");
    let tr='';w.sentences.forEach((s,i)=>{tr+='<div class="detail-line '+LCLS[s.t]+'"><div class="dpt" onclick="speak(getWeek(\''+w.id+'\').sentences['+i+'].pt)">'+s.pt+'</div><div class="dru">'+s.ru+'</div></div>';});
    fb.innerHTML='<div class="rule" style="border-color:var(--good);background:rgba(62,122,87,.08)">'+L.seqPerfect+'</div><div class="row"><button class="act good" onclick="speakWeek()">'+L.listenAll+'</button></div><div class="lbl">'+L.storyWithTr+'</div>'+tr;}
  else fb.innerHTML='<div class="rule" style="border-color:var(--terra);background:rgba(188,75,47,.08)">'+L.seqPart1+right+L.seqPart2+w.sentences.length+L.seqPart3+'</div>';
}
function speakWeek(){speak(getWeek(selWeek).sentences.map(s=>s.pt).join(" "));}

/* ===== ARCHIVE ===== */
function modeList(){return mode==="recall"?PHRASES:mode==="cloze"?CLOZE:mode==="contr"?CONTRACTIONS:mode==="syn"?SYN:ANTONYMS;}
function secTitleAll(){return (L.arc&&L.arc[mode])||(mode==="contr"?CL().arc:L.arc.recall);}
function previewOf(it){return mode==="recall"?it.pt:mode==="cloze"?it.q.replace("___","…"):mode==="contr"?contrCorrect(it):it.qpt;}
function weeksForMode(){
  if(mode==="seq")return WEEKS.map(w=>({key:w.id,label:w.label,date:w.date,month:w.month,items:w.sentences,preview:w.sentences.length?w.sentences[0].pt:""}));
  const list=modeList(),map={};
  list.forEach(it=>{const k=it.week||"_base";(map[k]=map[k]||[]).push(it);});
  const order=WEEKS.map(w=>w.id).filter(id=>map[id]);
  Object.keys(map).forEach(k=>{if(k!=="_base"&&order.indexOf(k)<0)order.push(k);});
  if(map["_base"])order.push("_base");
  return order.map(k=>{const w=getWeek(k),items=map[k];
    return {key:k,label:w?w.label:L.core,date:w?w.date:L.baseDate,month:w?w.month:L.baseMonth,items:items,preview:previewOf(items[0])};});
}
let ARCHM=[], ARCHSAY=[];
function buildArchM(){const wk=weeksForMode();ARCHM=[];const idx={};
  wk.forEach(w=>{if(!(w.month in idx)){idx[w.month]=ARCHM.length;ARCHM.push({month:w.month,weeks:[]});}ARCHM[idx[w.month]].weeks.push(w);});}
function renderArchMonths(){
  buildArchM();
  let h='<button class="back" onclick="closeArchive()">'+L.toTraining+'</button><span class="sit">'+secTitleAll()+'</span>';
  if(!ARCHM.length){h+='<div class="done"><p>'+L.arcEmpty+'</p></div>';card.innerHTML=h;return;}
  ARCHM.forEach((m,i)=>{const cnt=m.weeks.length;
    h+='<button class="week-item" onclick="openArchMonth('+i+')"><span class="wk" style="width:auto;min-width:96px">'+m.month+'</span><span class="pv">'+partsStr(cnt)+'</span>'+(i===0?'<span class="cur">'+L.cur+'</span>':'')+'</button>';});
  card.innerHTML=h;
}
function openArchMonth(i){const m=ARCHM[i];
  let h='<button class="back" onclick="renderArchMonths()">'+L.allMonths+'</button><span class="sit">'+m.month+'</span>';
  m.weeks.forEach((w,wi)=>{h+='<button class="week-item" onclick="openArchWeek('+i+','+wi+')"><span class="wk">'+w.label+'<small>'+w.date+'</small></span><span class="pv">'+w.preview+'</span></button>';});
  card.innerHTML=h;
}
function openArchWeek(i,wi){const m=ARCHM[i],w=m.weeks[wi];ARCHSAY=[];
  let h='<button class="back" onclick="openArchMonth('+i+')">← '+m.month+'</button><span class="sit">'+w.label+' · '+w.date+'</span>';
  if(mode==="seq"){
    w.items.forEach(s=>{const k=ARCHSAY.push(s.pt)-1;
      h+='<div class="detail-line '+LCLS[s.t]+'"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+s.pt+'</div><div class="dru">'+s.ru+'</div></div>';});
    h+='<div class="row"><button class="act listen" onclick="speakArch()">🔊</button><button class="act primary" onclick="trainWeek(\''+w.key+'\')">'+L.buildThis+'</button></div>';
  }else{
    w.items.forEach(it=>{
      if(mode==="recall"){const k=ARCHSAY.push(it.pt)-1;
        h+='<div class="detail-line"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+it.pt+'</div><div class="dru">'+it.ru+'</div></div>';}
      else if(mode==="cloze"){const ans=it.opts[it.ok],k=ARCHSAY.push(it.q.replace("___",ans))-1;
        h+='<div class="detail-line l-pre"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+it.q.replace("___","<mark>"+ans+"</mark>")+'</div><div class="dru">'+stripTags(it.rule)+'</div></div>';}
      else if(mode==="contr"){const corr=contrCorrect(it),k=ARCHSAY.push(it.ex||corr)-1;
        h+='<div class="detail-line l-pre"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+it.prep+' + '+it.art+' → <mark>'+corr+'</mark></div><div class="dru">'+(it.ex||"")+(it.exru?' — '+it.exru:'')+'</div></div>';}
      else if(mode==="syn"){const k=ARCHSAY.push(it.apt)-1;
        h+='<div class="detail-line"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+it.qpt+' ≈ '+markHi(it.apt,[it.wa])+'</div><div class="dru">'+it.qru+' → '+it.aru+'</div></div>';}
      else{const k=ARCHSAY.push(it.apt)-1;
        h+='<div class="detail-line '+(it.grp==="fis"?"l-fut":"l-pre")+'"><div class="dpt" onclick="speak(ARCHSAY['+k+'])">'+it.qpt+' → '+markHi(it.apt,[it.wa])+'</div><div class="dru">'+it.qru+' → '+it.aru+'</div></div>';}
    });
  }
  card.innerHTML=h;
}
function speakArch(){speak(ARCHSAY.join(" "));}
function trainWeek(id){selWeek=id;archiveScreen=null;setMode("seq");}
function closeArchive(){archiveScreen=null;applyView();}
function openArchive(){archiveScreen="list";applyView();}

/* ===== router ===== */
function applyView(){refreshWeekbar();
  if(archiveScreen==="list"){ renderArchMonths(); return; }
  if(mode==="recall"){buildRQ();renderRecall();}
  else if(mode==="cloze"){cI=0;renderCloze();}
  else if(mode==="contr"){buildKQ();renderContr();}
  else if(mode==="anton"){buildAQ();renderAnton();}
  else if(mode==="syn"){buildSQ();renderSyn();}
  else renderSeq();
}
function setMode(m){mode=m;archiveScreen=null;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mode===m));applyView();}

function applyI18n(){
  if(!L) L = I18N[(DATA.config&&DATA.config.ui)] || EMBEDDED_L;
  applyDir(); applyFont();
  var _lb=document.getElementById("langBtn"); if(_lb){_lb.onclick=function(){showPicker();};}
  document.documentElement.lang=(DATA.config&&DATA.config.ui)||"en";
  var _brand=(DATA.config&&DATA.config.brand)||L.brand;
  var _flag=(DATA.config&&DATA.config.flag!=null)?DATA.config.flag:L.flag;
  document.getElementById("wm").innerHTML=_brand+' <em>Treino</em>';
  document.getElementById("flag").textContent=_flag||"";
  document.querySelectorAll(".tab").forEach(t=>t.textContent=tabName(t.dataset.mode));
  document.getElementById("archBtn").textContent=L.archBtn;
  document.getElementById("footNote").textContent=L.footNote;
  var c=DATA.config||{}, links=[], _ui=c.ui||"ru";
  function _withLang(u){ return /^(https?:|mailto:|#)/.test(u)?u:(u.split("?")[0]+"?lang="+_ui); }
  if(c.flyerUrl)links.push('<a href="'+_withLang(c.flyerUrl)+'">'+(c.flyerText||"How it works")+'</a>');
  if(c.methodUrl)links.push('<a href="'+_withLang(c.methodUrl)+'">'+(c.methodText||"The method")+'</a>');
  if(typeof MANIFEST!=="undefined"&&MANIFEST&&MANIFEST.hubUrl&&L.hub&&L.hub.hubLink){
    var _hs=MANIFEST.hubUrl.indexOf("?")>=0?"&":"?";
    links.push('<a href="'+MANIFEST.hubUrl+_hs+'lang='+_ui+'" target="_blank" rel="noopener">'+L.hub.hubLink+'</a>');
  }
  document.getElementById("appLinks").innerHTML=links.join('<span class="sep">·</span>');
}

/* ===== СВАЙП (нейтральный пропуск) + АВТО-ПОДЪЁМ КНОПОК =====
   Свайп работает только в разделах с коробками: recall / anton / syn.
   Влево = следующая карточка, вправо = предыдущая. Коробку НЕ трогает —
   это просто навигация, прогресс остаётся честным (вариант А). */
function swipeEnabled(){return !archiveScreen && (mode==="recall"||mode==="anton"||mode==="syn");}
function swipeNav(dir){            // dir: +1 вперёд (следующая), -1 назад (предыдущая)
  if(mode==="recall"){ if(dir>0){if(rI<rQ.length)rI++;}else{if(rI>0)rI--;} rRev=false; renderRecall(); }
  else if(mode==="anton"){ if(dir>0){if(aI<aQ.length)aI++;}else{if(aI>0)aI--;} aRev=false; renderAnton(); }
  else if(mode==="syn"){ if(dir>0){if(sI<sQ.length)sI++;}else{if(sI>0)sI--;} sRev=false; renderSyn(); }
}
let _tsX=0,_tsY=0,_tsT=0;
function bindSwipe(){
  card.addEventListener("touchstart",function(e){var t=e.changedTouches[0];_tsX=t.clientX;_tsY=t.clientY;_tsT=Date.now();},{passive:true});
  card.addEventListener("touchend",function(e){
    if(!swipeEnabled())return;
    var t=e.changedTouches[0], dx=t.clientX-_tsX, dy=t.clientY-_tsY, dt=Date.now()-_tsT;
    if(dt>700)return;                          // слишком медленно — не свайп
    if(Math.abs(dx)<50)return;                 // короткое движение — это тап
    if(Math.abs(dx)<Math.abs(dy)*1.4)return;   // движение вертикальное — это скролл
    var dir = dx<0 ? 1 : -1;                   // палец справа налево = вперёд
    card.classList.add(dir>0?"sw-l":"sw-r");
    setTimeout(function(){card.classList.remove("sw-l","sw-r");swipeNav(dir);},130);
  },{passive:true});
}
/* кнопка действия (Показать ответ / Дальше / Вспомнил) всегда в зоне видимости */
var _fitTimer=null;
function fitButtons(){
  var rows=card.querySelectorAll(".row");
  if(!rows.length)return;
  var el=rows[rows.length-1], r=el.getBoundingClientRect();
  if(r.bottom>window.innerHeight-8 || r.top<0){
    el.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
function bindAutoFit(){
  var obs=new MutationObserver(function(){clearTimeout(_fitTimer);_fitTimer=setTimeout(fitButtons,70);});
  obs.observe(card,{childList:true,subtree:true});
}

function init(){
  LANG=(DATA.config&&DATA.config.lang)||"pt-PT";
  applyI18n();
  PHRASES=(DATA.phrases||[]).map(p=>({pt:p.pt,ru:p.ru,sit:p.sit||"",cue:p.cue||deriveCue(p.pt),hi:p.hi||[],week:p.week||null}));
  WEEKS=DATA.weeks||[];
  CLOZE=(Array.isArray(DATA.cloze)&&DATA.cloze.length)?DATA.cloze:CLOZE_FALLBACK;
  ANTONYMS=(Array.isArray(DATA.antonyms)&&DATA.antonyms.length)?DATA.antonyms:ANTONYMS_FALLBACK;
  SYN=(Array.isArray(DATA.synonyms)&&DATA.synonyms.length)?DATA.synonyms:SYN_FALLBACK;
  CONTRACTIONS=(Array.isArray(DATA.contractions)?DATA.contractions:[]).map(c=>({prep:c.prep,art:c.art,noun:c.noun,ru:c.ru||"",ex:c.ex||"",exru:c.exru||"",week:c.week||null}));
  CRULES=DATA.contractionRules||{};
  progress=loadProgress();
  PHRASES.forEach(p=>{p.box=getRec(p.pt).b;});
  ANTONYMS.forEach(p=>{p.box=getRec("A:"+p.qpt).b;});
  SYN.forEach(p=>{p.box=getRec("S:"+p.qpt).b;});
  CONTRACTIONS.forEach(c=>{c.box=getRec("C:"+kId(c)).b;});
  var ctab=document.querySelector('.tab[data-mode="contr"]'); if(ctab)ctab.style.display=CONTRACTIONS.length?'':'none';
  if(WEEKS.length)selWeek=WEEKS[0].id;
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
  document.getElementById("archBtn").onclick=openArchive;
  bindSwipe();
  bindAutoFit();
  setMode("recall");
}

/* загрузка контента: data.json → иначе встроенный */
/* ===== УНИВЕРСАЛЬНЫЙ ЗАПУСК: manifest → выбор пары → локаль → контент ===== */
let MANIFEST=null, PAIR=null;
const PAIR_KEY="treino_pair";
function qparam(n){return new URLSearchParams(location.search).get(n);}
async function loadJSON(url){ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status+" "+url); return await r.json(); }
function livePairs(){ return MANIFEST.pairs.filter(p=>p.live!==false); }
function resolvePairId(){
  var live=livePairs();
  var qp=qparam("pair"); if(qp && live.some(p=>p.id===qp)) return qp;
  var ql=qparam("lang"); if(ql){var m=live.find(p=>p.native===ql); if(m) return m.id;}
  var saved=null; try{saved=localStorage.getItem(PAIR_KEY);}catch(e){}
  if(saved && live.some(p=>p.id===saved)) return saved;
  return null;
}
function showPicker(){
  var live=livePairs();
  var html='<div class="pick-card"><div class="pick-title">🌐 Choose your language · Выбери язык</div><div class="pick-list">';
  live.forEach(function(p){ html+='<button class="pick-btn" data-pair="'+p.id+'"><span class="pf">'+(p.flag||"")+'</span><span class="pn">'+p.nativeName+' → '+p.targetName+'</span></button>'; });
  html+='</div></div>';
  var ov=document.getElementById("picker"); ov.innerHTML=html; ov.style.display="flex";
  ov.querySelectorAll(".pick-btn").forEach(function(b){ b.onclick=function(){ choosePair(b.dataset.pair); }; });
}
async function choosePair(id){ try{localStorage.setItem(PAIR_KEY,id);}catch(e){} document.getElementById("picker").style.display="none"; await bootPair(id); }
async function bootPair(id){
  PAIR=id; var deck=qparam("d")||""; LS_KEY="treino_progress_v1_"+id+(deck?"_"+deck:"");
  var entry=MANIFEST.pairs.find(p=>p.id===id);
  try{ if(!I18N[entry.native]) I18N[entry.native]=await loadJSON("ui/ui."+entry.native+".json"); }catch(e){ I18N[entry.native]=EMBEDDED_L; }
  L=I18N[entry.native]||EMBEDDED_L;
  var dataUrl=deck?entry.data.replace(".json","."+deck+".json"):entry.data;
  try{ var j=await loadJSON(dataUrl); DATA=(j&&(Array.isArray(j.phrases)||Array.isArray(j.weeks)))?j:EMBEDDED; }catch(e){ DATA=EMBEDDED; }
  init();
}
(async function(){
  try{ MANIFEST=await loadJSON("manifest.json"); }catch(e){ MANIFEST=null; }
  if(!MANIFEST){ L=EMBEDDED_L; DATA=EMBEDDED; init(); return; }
  var id=resolvePairId();
  if(id){ await bootPair(id); } else { showPicker(); }
})();
</script>
