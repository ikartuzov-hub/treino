<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino — твоя неделя на португальском</title>
<meta name="theme-color" content="#F2EBDA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EBDA; --paper:#FBF7EC; --ink:#16302B; --ink-soft:#54655A;
    --azul:#1F7A5C; --azul-deep:#0E5138; --terra:#BC4B2F; --gold:#C2872E;
    --line:#DBD0B8; --good:#3E7A57; --soft-shadow:0 18px 40px -22px rgba(22,48,43,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--cream);color:var(--ink);font-family:"Hanken Grotesk",sans-serif;line-height:1.6;
    padding:0 18px 56px;
    background-image:radial-gradient(circle at 10% 4%,rgba(31,122,92,.09),transparent 44%),radial-gradient(circle at 92% 0%,rgba(194,135,46,.09),transparent 40%);}
  .wrap{max-width:600px;margin:0 auto}
  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 0}
  .wm{font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
  .wm em{font-style:italic;color:var(--gold)}
  .flag{font-size:15px}
  .kick{font-family:"Hanken Grotesk";font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:38px 0 12px}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:33px;line-height:1.15;letter-spacing:-.015em;margin-bottom:16px}
  h1 .it{font-style:italic;color:var(--azul-deep)}
  .lede{font-size:17.5px;color:var(--ink);margin-bottom:26px}
  .cta{display:block;text-align:center;font-family:inherit;font-weight:700;font-size:17px;text-decoration:none;border-radius:13px;padding:17px 20px;transition:.16s;border:1px solid var(--ink)}
  .cta.primary{background:var(--ink);color:var(--paper);box-shadow:var(--soft-shadow)}
  .cta.primary:active{transform:translateY(1px)}
  .cta.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-size:15px;font-weight:600}
  .sub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:10px}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:22px;margin:46px 0 16px}
  .steps{display:flex;flex-direction:column;gap:12px}
  .step{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--soft-shadow)}
  .step .num{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:rgba(31,122,92,.12);color:var(--azul-deep);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step h3{font-family:"Fraunces",serif;font-size:17px;color:var(--azul-deep);margin-bottom:3px}
  .step p{font-size:14px;color:var(--ink-soft);margin:0}
  .prices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:4px}
  .price{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--soft-shadow);text-align:center}
  .price.lead{border-color:var(--azul);border-width:1.5px}
  .badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--terra);color:#fff;padding:4px 11px;border-radius:99px;white-space:nowrap}
  .price .name{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
  .price .amt{font-family:"Fraunces",serif;font-size:38px;color:var(--azul-deep);line-height:1}
  .price .old{font-size:15px;color:var(--ink-soft);text-decoration:line-through;margin-left:6px}
  .price .desc{font-size:13px;color:var(--ink-soft);margin-top:12px;line-height:1.45}
  .free{background:rgba(62,122,87,.08);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:16px;font-size:14.5px;color:var(--ink)}
  .free b{color:var(--azul-deep)}
  .email{display:block;text-align:center;margin-top:8px;color:var(--azul);font-weight:600;text-decoration:none;word-break:break-word}
  .fineprint{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:18px;line-height:1.6}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:42px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
  .foot a{color:var(--azul);text-decoration:none;font-weight:600}
  .reveal{opacity:0;transform:translateY(12px);animation:rise .6s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media(max-width:420px){h1{font-size:28px}.prices{grid-template-columns:1fr;gap:18px}}

  /* блок-приглашение в Хаб (вау-воронка) */
  .hub-cta{margin:34px 0 6px;padding:26px 22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(31,122,92,.10),rgba(194,135,46,.10));position:relative;overflow:hidden}
  .hub-cta::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -10%,rgba(194,135,46,.20),transparent 55%);pointer-events:none}
  .hub-kicker{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--azul,#1F7A5C);margin-bottom:10px;position:relative}
  .hub-title{font-family:"Fraunces",serif;font-size:21px;line-height:1.3;color:var(--ink,#16302B);margin-bottom:10px;position:relative}
  .hub-text{font-size:14.5px;line-height:1.55;color:var(--ink-soft,#54655A);margin-bottom:18px;max-width:46ch;position:relative}
  .hub-btn{display:inline-block;background:var(--azul-deep,#0E5138);color:#fff;font-family:inherit;font-weight:700;font-size:15px;text-decoration:none;padding:14px 22px;border-radius:12px;box-shadow:0 12px 26px -14px rgba(14,81,56,.7);transition:.16s;position:relative}
  .hub-btn:active{transform:translateY(1px)}

  .owner{text-align:center;margin-top:16px;font-size:11px;color:var(--ink-soft,#54655A);opacity:.6;letter-spacing:.02em}
</style>
<link rel="canonical" href="https://t.seedwave.pt/u/start.html">
</head>
<body>
<div id="page"><p style="text-align:center;padding:48px 20px;color:#54655A">…</p></div>
<script>
const PAGE="start";
function qp(n){return new URLSearchParams(location.search).get(n);}
async function J(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;return r.json();}
async function T(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;return r.text();}
(async function(){
  let mf=null; try{mf=await J("manifest.json");}catch(e){}
  // определяем язык носителя
  let lang=qp("lang");
  if(!lang&&mf){var pid=qp("pair"); if(pid){var e=mf.pairs.find(p=>p.id===pid); if(e)lang=e.native;}}
  if(!lang&&mf){try{var sv=localStorage.getItem("treino_pair"); if(sv){var e2=mf.pairs.find(p=>p.id===sv); if(e2)lang=e2.native;}}catch(e){}}
  if(!lang&&mf&&mf.defaultPair){var ed=mf.pairs.find(p=>p.id===mf.defaultPair); if(ed)lang=ed.native;}
  if(!lang)lang="ru";
  // грузим локаль и фрагмент; если фрагмента нет — откат на en
  let L={};
  let frag="";
  try{ frag=await T("pages/"+PAGE+"."+lang+".html"); }
  catch(e){ lang="en"; try{frag=await T("pages/"+PAGE+".en.html");}catch(e2){frag="<div class='wrap'><p style='text-align:center;padding:40px'>—</p></div>";} }
  try{ L=await J("ui/ui."+lang+".json"); }catch(e){}
  document.documentElement.lang=lang;
  document.documentElement.dir=(L&&L.dir)||"ltr";
  const page=document.getElementById("page");
  page.innerHTML=frag;
  // блок Хаба (вау-воронка) с передачей языка
  if(mf&&mf.hubUrl&&L.hub){
    var sep=mf.hubUrl.indexOf("?")>=0?"&":"?";
    var url=mf.hubUrl+sep+"lang="+lang;
    var h=document.createElement("section"); h.className="hub-cta reveal";
    h.innerHTML='<div class="hub-kicker">'+(L.hub.hubKicker||"")+'</div>'+
                '<div class="hub-title">'+(L.hub.hubTitle||"")+'</div>'+
                '<p class="hub-text">'+(L.hub.hubText||"")+'</p>'+
                '<a class="hub-btn" href="'+url+'" target="_blank" rel="noopener">'+(L.hub.hubBtn||"Hub →")+'</a>';
    var wrap=page.querySelector(".wrap")||page;
    var foot=wrap.querySelector(".foot");
    if(foot)wrap.insertBefore(h,foot); else wrap.appendChild(h);
  }
  // знак авторства
  var _own=document.createElement("p"); _own.className="owner"; _own.textContent="© Igor Kartuzov · Treino";
  (page.querySelector(".wrap")||page).appendChild(_own);
  // внутренние ссылки несут выбранный язык дальше
  page.querySelectorAll("a[href]").forEach(function(a){
    var hr=a.getAttribute("href");
    if(/^(https?:|mailto:|tel:|#)/.test(hr))return;
    a.setAttribute("href", hr.split("?")[0]+"?lang="+lang);
  });
})();
</script>
</body>
</html>
