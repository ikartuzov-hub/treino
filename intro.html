<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  /* Светлая тема — по умолчанию */
  :root{
    --bg:#f7f0e4; --ink:#2a211a; --dim:#9c8a76;
    --accent:#a86f33; --accent-ink:#fbf6ee;
    --card:#fffaf2; --line:#e7dcc9;
  }
  :root[data-theme="dark"]{
    --bg:#14100d; --ink:#f1e8dd; --dim:#8d7f70;
    --accent:#c89b6d; --accent-ink:#1a140f;
    --card:#1d1813; --line:#332a21;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
    transition:background .4s ease,color .4s ease;
  }
  .brandmark{position:fixed;top:13px;left:16px;width:24px;height:24px;z-index:10}
  .brandmark img{width:100%;height:100%}
  .topctrl{position:fixed;top:12px;right:14px;z-index:10;display:flex;align-items:center;gap:8px}
  .themebtn{
    background:none;border:1px solid transparent;color:var(--dim);
    font-size:16px;line-height:1;padding:6px 9px;border-radius:999px;cursor:pointer;
    animation:blink 1.6s ease 4;animation-delay:.8s;
  }
  .themebtn:active{transform:scale(.95)}
  .langbar{display:flex;gap:6px;animation:blink .8s ease 4;}
  .langbar button{
    background:none;border:1px solid transparent;color:var(--dim);
    font-size:12px;letter-spacing:.08em;padding:5px 8px;border-radius:999px;
    cursor:pointer;text-transform:uppercase;
  }
  .langbar button.on{color:var(--accent);border-color:var(--accent)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  .step{display:none;flex-direction:column;align-items:center;gap:30px;max-width:560px;width:100%}
  .step.on{display:flex}

  /* Экран 1 — приветствие */
  .hello{
    font-family:'Caveat',cursive;
    font-size:clamp(40px,11vw,64px);line-height:1.2;color:var(--ink);
    min-height:1.3em;opacity:0;transform:translateY(6px);
    transition:opacity .9s ease,transform .9s ease;
  }
  .hello.show{opacity:1;transform:translateY(0)}
  .talk{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(24px,6vw,34px);line-height:1.4;min-height:1.4em;color:var(--accent);
  }
  .meet{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(18px,4.4vw,23px);line-height:1.5;min-height:4.5em;text-align:left;
  }
  .donetxt{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(19px,4.6vw,26px);line-height:1.5;min-height:1.5em;
  }

  .btn{
    font-family:inherit;font-size:17px;letter-spacing:.02em;
    padding:15px 38px;border-radius:999px;cursor:pointer;
    border:1px solid var(--accent);background:none;color:var(--accent);
    transition:background .25s,color .25s;will-change:transform;
  }
  .btn:hover{background:var(--accent);color:var(--accent-ink)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.big{font-size:21px;padding:17px 52px}
  .btn.hidden{visibility:hidden;pointer-events:none}
  .btn.small{font-size:14px;padding:9px 18px}
  .btn:disabled{opacity:.5;pointer-events:none}

  /* Экран 2 — форма рассказа */
  .card{
    width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;
  }
  textarea{
    width:100%;min-height:110px;resize:vertical;
    background:none;border:1px solid var(--line);border-radius:12px;
    padding:12px;font-family:inherit;font-size:16px;color:var(--ink);
  }
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .voiceRow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .voiceFold{font-size:14px}
  .voiceFold summary{color:var(--dim);cursor:pointer;list-style:none;padding:4px 0}
  .voiceFold summary::-webkit-details-marker{display:none}
  .voiceFold summary::before{content:"▸ ";color:var(--accent)}
  .voiceFold[open] summary::before{content:"▾ "}
  #btnSpeak.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .voiceHint{font-size:14px;color:var(--dim)}
  .timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent);min-width:3.2em}
  audio{width:100%;height:38px}
  input[type=text]{
    width:100%;background:none;border:1px solid var(--line);border-radius:12px;
    padding:12px;font-family:inherit;font-size:16px;color:var(--ink);
  }
  .fieldLabel{font-size:14px;color:var(--dim)}
  .err{font-size:14px;color:#c0392b;min-height:1.2em}

  footer{padding:18px;text-align:center;font-size:12px;color:var(--dim);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  footer a{color:var(--dim)}
  @media (prefers-reduced-motion: reduce){
    .themebtn,.langbar{animation:none}
    .hello{transition:none}
  }
</style>
</head>
<body>

<a class="brandmark" id="brandLink" href="./"><img src="icon.svg" alt="Treino"></a>
<div class="topctrl">
  <div class="langbar" id="langbar"></div>
  <button class="themebtn" id="themeBtn" aria-label="theme">☾</button>
</div>

<main>
  <!-- Экран 1: приветствие -->
  <section class="step on" id="s1">
    <div class="hello" id="hello"></div>
    <div class="talk" id="talk"></div>
    <button class="btn primary big hidden" id="btnYes"></button>
  </section>

  <!-- Экран 2: знакомство -->
  <section class="step" id="s2">
    <div class="meet" id="meet"></div>
    <div class="card" id="formCard" style="visibility:hidden">
      <div class="voiceRow" id="speakRow">
        <button class="btn small" id="btnSpeak"></button>
        <span class="voiceHint" id="speakHint"></span>
      </div>
      <textarea id="storyText"></textarea>
      <details class="voiceFold">
        <summary id="orVoice"></summary>
        <div class="voiceRow" style="margin-top:10px">
          <button class="btn small" id="btnRec"></button>
          <span class="timer" id="timer"></span>
        </div>
        <div class="voiceRow" id="playRow" style="display:none;margin-top:10px">
          <audio id="player" controls></audio>
          <button class="btn small" id="btnRedo"></button>
          <button class="btn small" id="btnDel"></button>
        </div>
      </details>
      <div class="fieldLabel" id="contactLabel"></div>
      <input type="text" id="contact" autocomplete="off">
      <div class="err" id="err"></div>
      <button class="btn primary" id="btnSend"></button>
    </div>
  </section>

  <!-- Экран 3: подтверждение -->
  <section class="step" id="s3">
    <div class="donetxt" id="done"></div>
    <button class="btn hidden" id="btnDemo"></button>
  </section>
</main>

<footer>
  <span>©</span>
  <a id="authorLink" target="_blank" rel="noopener">Igor Kartuzov</a>
  <span>·</span>
  <a id="hubLink">SeedWave</a>
  <span style="opacity:.55">intro v11</span>
</footer>

<script>
/* ===== РЕЕСТР ===== */
const APP_URL    = "https://ikartuzov-hub.github.io/treino/u/";
const HUB_URL    = "https://ikartuzov-hub.github.io/seedwave-catalog/hub/";
const AUTHOR_URL = "https://www.linkedin.com/in/igor-kartuzov/";
const WEBHOOK_URL= "https://hook.eu1.make.com/6ekpbl8k93cn9ne26nh5x9xfq2y1uom9";
const MAX_REC_SEC= 180;

/* ===== ПРИВЕТСТВИЯ (цикл pt → en → ru → es → de) ===== */
const GREETS = [
  "Olá! Bom dia! Como está?",
  "Hello! Good morning! How are you?",
  "Привет! Доброе утро! Как дела?",
  "¡Hola! ¡Buenos días! ¿Qué tal?",
  "Hallo! Guten Morgen! Wie geht's?"
];

/* ===== ЛОКАЛИ ===== */
const LOCALES = {
  ru:{dir:"ltr",ui:{
    talk:"Поговорим?", yes:"Да!",
    meet:"Круто! Познакомимся? Расскажи немного о себе: кто ты, как прошла твоя неделя, что принесло приятные моменты, что интересного планируешь дальше? Текстом или голосом — а я соберу из твоего рассказа твой личный Treino.",
    ph:"Напиши здесь…", orVoice:"…или расскажи голосом:",
    speak:"🎤 Говорить", speakStop:"⏹ Остановить", speakHint:"Говори — я запишу словами, потом сможешь поправить.",
    rec:"🎙 Записать", stop:"⏹ Стоп", redo:"↻ Перезаписать", del:"✕ Удалить",
    contactLabel:"Куда прислать ссылку на твой личный Treino?",
    contactPh:"Telegram / WhatsApp / email",
    send:"Отправить", sending:"Отправляю…",
    done:"Рад знакомству! Собираю твой личный Treino — ссылка придёт туда, куда ты указал, уже скоро.",
    demo:"А пока — открой демо",
    needStory:"Расскажи что-нибудь — текстом или голосом.",
    needContact:"Укажи, куда прислать ссылку.",
    errMic:"Нет доступа к микрофону. Разреши доступ или напиши текстом.",
    errSend:"Не отправилось. Проверь интернет и нажми ещё раз."}},
  en:{dir:"ltr",ui:{
    talk:"Shall we talk?", yes:"Yes!",
    meet:"Great! Let's get to know each other. Tell me a bit about yourself: who you are, how your week went, what brought you nice moments, what interesting things are coming up? Type or speak — and I'll build your personal Treino from your story.",
    ph:"Write here…", orVoice:"…or tell me by voice:",
    speak:"🎤 Speak", speakStop:"⏹ Stop", speakHint:"Speak — I'll write it down, then you can fix it.",
    rec:"🎙 Record", stop:"⏹ Stop", redo:"↻ Re-record", del:"✕ Delete",
    contactLabel:"Where should I send the link to your personal Treino?",
    contactPh:"Telegram / WhatsApp / email",
    send:"Send", sending:"Sending…",
    done:"Nice to meet you! I'm building your personal Treino — the link will arrive where you told me, very soon.",
    demo:"Meanwhile — open the demo",
    needStory:"Tell me something — by text or voice.",
    needContact:"Tell me where to send the link.",
    errMic:"No microphone access. Allow access or just type.",
    errSend:"Sending failed. Check your connection and try again."}},
  pt:{dir:"ltr",ui:{
    talk:"Falamos?", yes:"Sim!",
    meet:"Boa! Vamos conhecer-nos? Conta um pouco de ti: quem és, como foi a tua semana, o que te trouxe bons momentos, o que planeias de interessante? Por texto ou por voz — e eu construo o teu Treino pessoal a partir da tua história.",
    ph:"Escreve aqui…", orVoice:"…ou conta por voz:",
    speak:"🎤 Falar", speakStop:"⏹ Parar", speakHint:"Fala — eu escrevo, depois podes corrigir.",
    rec:"🎙 Gravar", stop:"⏹ Parar", redo:"↻ Regravar", del:"✕ Apagar",
    contactLabel:"Para onde envio o link do teu Treino pessoal?",
    contactPh:"Telegram / WhatsApp / email",
    send:"Enviar", sending:"A enviar…",
    done:"Prazer em conhecer-te! Estou a construir o teu Treino pessoal — o link chega onde indicaste, muito em breve.",
    demo:"Entretanto — abre a demo",
    needStory:"Conta-me algo — por texto ou por voz.",
    needContact:"Indica para onde enviar o link.",
    errMic:"Sem acesso ao microfone. Permite o acesso ou escreve.",
    errSend:"Não foi enviado. Verifica a internet e tenta de novo."}},
  es:{dir:"ltr",ui:{
    talk:"¿Hablamos?", yes:"¡Sí!",
    meet:"¡Genial! ¿Nos conocemos? Cuéntame un poco de ti: quién eres, cómo fue tu semana, qué te trajo buenos momentos, qué planeas de interesante? Por texto o por voz — y construiré tu Treino personal a partir de tu historia.",
    ph:"Escribe aquí…", orVoice:"…o cuéntalo con tu voz:",
    speak:"🎤 Hablar", speakStop:"⏹ Parar", speakHint:"Habla — yo lo escribo, luego puedes corregirlo.",
    rec:"🎙 Grabar", stop:"⏹ Parar", redo:"↻ Regrabar", del:"✕ Borrar",
    contactLabel:"¿Adónde envío el enlace de tu Treino personal?",
    contactPh:"Telegram / WhatsApp / email",
    send:"Enviar", sending:"Enviando…",
    done:"¡Encantado de conocerte! Estoy creando tu Treino personal — el enlace llegará adonde indicaste, muy pronto.",
    demo:"Mientras tanto — abre la demo",
    needStory:"Cuéntame algo — por texto o por voz.",
    needContact:"Indica adónde enviar el enlace.",
    errMic:"Sin acceso al micrófono. Permite el acceso o escribe.",
    errSend:"No se envió. Revisa tu conexión e inténtalo de nuevo."}},
  de:{dir:"ltr",ui:{
    talk:"Reden wir?", yes:"Ja!",
    meet:"Super! Lernen wir uns kennen? Erzähl ein wenig von dir: wer du bist, wie deine Woche war, was dir schöne Momente gebracht hat, was du Interessantes vorhast? Per Text oder Stimme — und ich baue daraus dein persönliches Treino.",
    ph:"Schreib hier…", orVoice:"…oder erzähl es mit deiner Stimme:",
    speak:"🎤 Sprechen", speakStop:"⏹ Stopp", speakHint:"Sprich — ich schreibe mit, danach kannst du es korrigieren.",
    rec:"🎙 Aufnehmen", stop:"⏹ Stopp", redo:"↻ Neu aufnehmen", del:"✕ Löschen",
    contactLabel:"Wohin soll ich den Link zu deinem persönlichen Treino senden?",
    contactPh:"Telegram / WhatsApp / E-Mail",
    send:"Senden", sending:"Wird gesendet…",
    done:"Schön, dich kennenzulernen! Ich baue dein persönliches Treino — der Link kommt bald dorthin, wo du es angegeben hast.",
    demo:"Inzwischen — öffne die Demo",
    needStory:"Erzähl mir etwas — per Text oder Stimme.",
    needContact:"Gib an, wohin der Link gehen soll.",
    errMic:"Kein Mikrofonzugriff. Erlaube den Zugriff oder schreibe.",
    errSend:"Senden fehlgeschlagen. Prüfe die Verbindung und versuche es erneut."}}
};

/* ===== ДВИЖОК ===== */
const params=new URLSearchParams(location.search);
let lang=params.get("lang");
if(!LOCALES[lang]){const nav=(navigator.language||"en").slice(0,2).toLowerCase();lang=LOCALES[nav]?nav:"en";}
let L=LOCALES[lang];
let theme=params.get("theme")==="dark"?"dark":"light";   /* светлая — по умолчанию */
const $=id=>document.getElementById(id);
const withNav=u=>u+(u.includes("?")?"&":"?")+"lang="+lang+"&theme="+theme;

function buildLangbar(){
  const bar=$("langbar");bar.innerHTML="";
  Object.keys(LOCALES).forEach(code=>{
    const b=document.createElement("button");
    b.textContent=code;
    if(code===lang)b.classList.add("on");
    b.onclick=function(){const u=new URL(location.href);u.searchParams.set("lang",code);u.searchParams.set("theme",theme);location.href=u.toString();};
    bar.appendChild(b);
  });
}
function applyLocale(){
  document.documentElement.lang=lang;
  document.documentElement.dir=L.dir||"ltr";
  $("btnYes").textContent=L.ui.yes;
  $("storyText").placeholder=L.ui.ph;
  $("btnSpeak").textContent=L.ui.speak;
  $("speakHint").textContent=L.ui.speakHint;
  $("orVoice").textContent=L.ui.orVoice;
  $("btnRec").textContent=L.ui.rec;
  $("btnRedo").textContent=L.ui.redo;
  $("btnDel").textContent=L.ui.del;
  $("contactLabel").textContent=L.ui.contactLabel;
  $("contact").placeholder=L.ui.contactPh;
  $("btnSend").textContent=L.ui.send;
  $("btnDemo").textContent=L.ui.demo;
  $("authorLink").href=AUTHOR_URL;
  $("hubLink").href=withNav(HUB_URL);
}

/* ---- ПЕЧАТЬ через requestAnimationFrame (iOS-устойчиво) ---- */
const CPS=22;
function typeLine(el,text,done){
  el.textContent="";
  let shown=0,start=null,finished=false;
  function finish(){
    if(finished)return;finished=true;
    el.textContent=text;
    setTimeout(function(){ if(done)done(); },300);
  }
  function frame(ts){
    if(start===null)start=ts;
    const should=Math.floor((ts-start)/1000*CPS);
    if(should!==shown){
      shown=Math.min(should,text.length);
      el.textContent=text.slice(0,shown)+(shown<text.length?"▎":"");
    }
    if(shown<text.length){ requestAnimationFrame(frame); }
    else { finish(); }
  }
  requestAnimationFrame(frame);
  setTimeout(finish,Math.max(3500,text.length/CPS*1000+1500));
}

/* ---- ПУЛЬСАЦИЯ через requestAnimationFrame ---- */
const pulsing=new Set();
function pulseOn(id){ pulsing.add(id); }
function pulseOff(id){ pulsing.delete(id); const e=$(id); if(e)e.style.transform=""; }
function pulseLoop(ts){
  const s=1+0.07*(0.5+0.5*Math.sin(ts/230));
  pulsing.forEach(function(id){ const e=$(id); if(e)e.style.transform="scale("+s.toFixed(4)+")"; });
  requestAnimationFrame(pulseLoop);
}
requestAnimationFrame(pulseLoop);

function show(stepId){ document.querySelectorAll(".step").forEach(function(s){s.classList.remove("on");}); $(stepId).classList.add("on"); }

/* ===== ЭКРАН 1: цикл приветствий ===== */
let greetIdx=0, greetRunning=true;
function cycleGreet(){
  if(!greetRunning)return;
  const el=$("hello");
  el.classList.remove("show");
  setTimeout(function(){
    el.textContent=GREETS[greetIdx%GREETS.length];
    greetIdx++;
    el.classList.add("show");
    setTimeout(cycleGreet,3000);   /* держим 3с, потом смена */
  },900);
}
function enterS1(){
  show("s1");
  cycleGreet();
  /* после первого приветствия — печатаем «Поговорим?» на языке пользователя */
  setTimeout(function(){
    typeLine($("talk"),L.ui.talk,function(){
      const b=$("btnYes");
      b.classList.remove("hidden");
      b.style.animation="blink .55s ease 4";
      setTimeout(function(){ b.style.animation=""; pulseOn("btnYes"); },2300);
    });
  },2600);
}

/* ===== ЭКРАН 2: знакомство ===== */
function enterS2(){
  greetRunning=false;
  show("s2");
  pulseOff("btnYes");
  typeLine($("meet"),L.ui.meet,function(){
    $("formCard").style.visibility="visible";
  });
}

/* ---- Живая расшифровка речи (Web Speech API) ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const BCP = {ru:"ru-RU",en:"en-US",pt:"pt-PT",es:"es-ES",de:"de-DE"};
let recog=null, listening=false, baseText="";
function initSpeech(){
  if(!SR){ $("speakRow").style.display="none"; return; }   // нет поддержки → прячем, остаётся запись файлом
  recog=new SR();
  recog.lang=BCP[lang]||"en-US";
  recog.continuous=true;
  recog.interimResults=true;
  recog.onresult=function(e){
    let fin="",intr="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)fin+=t; else intr+=t;
    }
    if(fin)baseText=(baseText+" "+fin).trim();
    $("storyText").value=(baseText+" "+intr).trim();
  };
  recog.onerror=function(ev){
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ $("err").textContent=L.ui.errMic; }
    stopSpeak();
  };
  recog.onend=function(){ if(listening){ try{recog.start();}catch(e){} } };  // авто-перезапуск пока слушаем
}
function startSpeak(){
  if(!recog)return;
  $("err").textContent="";
  baseText=$("storyText").value.trim();
  listening=true;
  try{recog.start();}catch(e){}
  $("btnSpeak").textContent=L.ui.speakStop;
  $("btnSpeak").classList.add("live");
  pulseOn("btnSpeak");
}
function stopSpeak(){
  listening=false;
  if(recog){try{recog.stop();}catch(e){}}
  $("btnSpeak").textContent=L.ui.speak;
  $("btnSpeak").classList.remove("live");
  pulseOff("btnSpeak");
}
$("btnSpeak").onclick=function(){ listening?stopSpeak():startSpeak(); };
initSpeech();

/* ---- Запись голоса файлом (фолбэк) ---- */
let mediaRecorder=null, chunks=[], audioBlob=null, audioMime="", recTimer=null, recSec=0;
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
async function startRec(){
  $("err").textContent="";
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioMime=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":
              MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"";
    mediaRecorder=audioMime?new MediaRecorder(stream,{mimeType:audioMime}):new MediaRecorder(stream);
    audioMime=mediaRecorder.mimeType||audioMime;
    chunks=[];
    mediaRecorder.ondataavailable=function(e){ if(e.data.size)chunks.push(e.data); };
    mediaRecorder.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      audioBlob=new Blob(chunks,{type:audioMime});
      $("player").src=URL.createObjectURL(audioBlob);
      $("playRow").style.display="flex";
      $("btnRec").style.display="none";
      $("timer").textContent=fmt(recSec);
    };
    mediaRecorder.start();
    recSec=0;$("timer").textContent="0:00";
    recTimer=setInterval(function(){
      recSec++;$("timer").textContent=fmt(recSec);
      if(recSec>=MAX_REC_SEC)stopRec();
    },1000);
    $("btnRec").textContent=L.ui.stop;
  }catch(e){ $("err").textContent=L.ui.errMic; }
}
function stopRec(){
  if(recTimer){clearInterval(recTimer);recTimer=null;}
  if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();
  $("btnRec").textContent=L.ui.rec;
}
function resetRec(){
  audioBlob=null;chunks=[];
  $("player").src="";
  $("playRow").style.display="none";
  $("btnRec").style.display="";
  $("btnRec").textContent=L.ui.rec;
  $("timer").textContent="";
}
$("btnRec").onclick=function(){
  if(mediaRecorder&&mediaRecorder.state==="recording")stopRec();
  else startRec();
};
$("btnRedo").onclick=function(){ resetRec(); startRec(); };
$("btnDel").onclick=resetRec;

/* ---- Отправка ---- */
function blobToBase64(blob){
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){res(String(r.result).split(",")[1]);};
    r.onerror=function(){rej(new Error("read failed"));};
    r.readAsDataURL(blob);
  });
}
$("btnSend").onclick=async function(){
  if(listening)stopSpeak();
  $("err").textContent="";
  const text=$("storyText").value.trim();
  const contact=$("contact").value.trim();
  if(!text&&!audioBlob){$("err").textContent=L.ui.needStory;return;}
  if(!contact){$("err").textContent=L.ui.needContact;return;}
  const btn=$("btnSend");btn.disabled=true;btn.textContent=L.ui.sending;
  try{
    const payload={
      type:"treino_intake",
      lang:lang, theme:theme,
      contact:contact,
      text:text||null,
      audio:audioBlob?await blobToBase64(audioBlob):null,
      audio_mime:audioBlob?audioMime:null,
      audio_sec:audioBlob?recSec:null,
      ua:navigator.userAgent,
      ts:new Date().toISOString()
    };
    const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error("http "+r.status);
    enterS3();
  }catch(e){
    $("err").textContent=L.ui.errSend;
    btn.disabled=false;btn.textContent=L.ui.send;
  }
};

/* ===== ЭКРАН 3 ===== */
function enterS3(){
  show("s3");
  typeLine($("done"),L.ui.done,function(){
    const b=$("btnDemo");
    b.classList.remove("hidden");pulseOn("btnDemo");
  });
}
$("btnDemo").onclick=function(){location.href=withNav(APP_URL);};

/* ---- Тема ---- */
function setTheme(t){
  theme=t;
  if(t==="dark")document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  $("themeBtn").textContent=(t==="dark")?"☀":"☾";
  $("hubLink").href=withNav(HUB_URL);
}
buildLangbar();applyLocale();setTheme(theme);
$("themeBtn").onclick=function(){ setTheme(theme==="dark"?"light":"dark"); };
$("btnYes").onclick=enterS2;
enterS1();
</script>
